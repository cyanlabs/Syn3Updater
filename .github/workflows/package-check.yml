name: Package check

# The Linux package's installer and launcher entry are easy to break without any test failing, so build one and install it for real
# whenever the packaging scripts change.
on:
  pull_request:
    paths: ["scripts/package-linux.sh", "scripts/verify-linux-package.sh", "scripts/package-deb.sh", "scripts/package-rpm.sh", "scripts/stage-linux-root.sh", "scripts/verify-*linux*.sh", "scripts/verify-aur-package.sh", "scripts/update-aur-package.sh", "packaging/linux/**", "packaging/aur/**", ".github/workflows/package-check.yml"]
  push:
    branches: [main]
    paths: ["scripts/package-linux.sh", "scripts/verify-linux-package.sh", "scripts/package-deb.sh", "scripts/package-rpm.sh", "scripts/stage-linux-root.sh", "scripts/verify-*linux*.sh", "scripts/verify-aur-package.sh", "scripts/update-aur-package.sh", "packaging/linux/**", "packaging/aur/**", ".github/workflows/package-check.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  linux-package:
    name: Build and install the Linux packages
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: scripts/package-linux.sh linux-x64 0.0.0-check artifacts
        env:
          SYN3_API_TOKEN: ${{ secrets.SYN3_API_TOKEN }}
      - run: scripts/verify-linux-package.sh artifacts/*.tar.gz
      - name: Build the .deb and .rpm
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rpm
          scripts/package-deb.sh linux-x64 0.0.0-check artifacts
          scripts/package-rpm.sh linux-x64 0.0.0-check artifacts
      - name: Install the .deb and .rpm in Debian, Ubuntu and Fedora
        run: scripts/verify-linux-distro-packages.sh artifacts
      - name: Build the AUR package in Arch Linux
        run: scripts/verify-aur-package.sh artifacts/Syn3Updater-0.0.0-check-linux-x64.tar.gz
