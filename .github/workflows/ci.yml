name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      # The CyanLabs API token is compiled into the app at build time. It is only available to builds of this repository
      # (not to pull requests from forks); without it the build and tests still work, only the live API check is skipped.
      - name: Build
        run: dotnet build tests/Syn3Updater.Tests -c Release
        env:
          SYN3_API_TOKEN: ${{ secrets.SYN3_API_TOKEN }}

      - name: Test
        run: dotnet test tests/Syn3Updater.Tests -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults
        env:
          SYN3_API_TOKEN: ${{ secrets.SYN3_API_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore

  # The Windows in-place update replaces files while Syn3Updater.exe is still running (Windows allows a running program to be renamed, not overwritten or deleted).
  # This proves it for the real published single-file program, not just for the tests' stand-in.
  windows-self-replace:
    name: A running Syn3Updater.exe can be replaced (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Publish the app the way releases do
        run: dotnet publish src/Syn3Updater.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o out
        env:
          SYN3_API_TOKEN: ${{ secrets.SYN3_API_TOKEN }}
      - name: Rename and replace it while it runs
        shell: pwsh
        run: |
          $env:SYN3_DATA_DIR = Join-Path $env:RUNNER_TEMP 'syn3data'
          $dir = Join-Path $PWD 'out'; $exe = Join-Path $dir 'Syn3Updater.exe'; $old = Join-Path $dir 'Syn3Updater.exe.old'
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "Syn3Updater.exe exited on its own (code $($p.ExitCode)) before the test could start" }
          Rename-Item $exe $old                                   # the step the update depends on
          Copy-Item $old $exe                                     # a program in its place
          $deleted = $true; try { Remove-Item $old -ErrorAction Stop } catch { $deleted = $false }
          if ($deleted) { throw "the running program's old file could be deleted, which Windows should not allow" }
          "as expected: renamed aside and replaced while running, and the old file cannot be deleted until it exits"
          $p2 = Start-Process $exe -PassThru                      # the replacement starts (it hands over to the running copy and exits: one copy at a time)
          $p2 | Wait-Process -Timeout 30
          Stop-Process -Id $p.Id -Force; $p.WaitForExit()
          Remove-Item $old                                        # once it has exited the old file goes
          if (Test-Path $old) { throw "the old file is still there after the program exited" }
      # The published app must be able to retarget a Windows shortcut. The shortcut code uses built-in COM, which an Avalonia template default (BuiltInComInteropSupport=false) switches off in
      # the real program while every test still passes (the test host has COM): this runs the real single-file program against a real shortcut.
      - name: The published app retargets a Launcher shortcut
        shell: pwsh
        run: |
          $env:SYN3_DATA_DIR = Join-Path $env:RUNNER_TEMP 'syn3data-migrate'
          $dir = Join-Path $PWD 'out-migrate'; Copy-Item (Join-Path $PWD 'out') $dir -Recurse
          Set-Content (Join-Path $dir '.install-method') 'zip'              # what the Windows zip carries: evidence that this folder is an install
          $exe = Join-Path $dir 'Syn3Updater.exe'; $launcher = Join-Path $dir 'Launcher.exe'
          $lnk = Join-Path $env:PUBLIC 'Desktop\Syn3Updater-CI.lnk'
          $sh = New-Object -ComObject WScript.Shell
          $l = $sh.CreateShortcut($lnk); $l.TargetPath = $launcher; $l.Description = 'CI'; $l.Save()   # what the v2 installer made
          $p = Start-Process $exe -PassThru
          $target = ''
          for ($i = 0; $i -lt 45; $i++) { Start-Sleep -Seconds 2; $target = $sh.CreateShortcut($lnk).TargetPath; if ($target -like '*Syn3Updater.exe') { break } }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force; $p.WaitForExit() }
          Start-Sleep -Seconds 2
          foreach ($f in 'applog.txt','crash.txt') { $path = Join-Path $env:SYN3_DATA_DIR $f; if (Test-Path $path) { "--- $f"; Get-Content $path -Tail 25 } }
          Remove-Item $lnk -ErrorAction SilentlyContinue
          if ($target -notlike '*Syn3Updater.exe') { throw "the shortcut still points at '$target': the published app could not retarget it (see the log above)" }
          "the shortcut was retargeted to $target"

