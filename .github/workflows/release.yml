name: Release

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 3 * * *"          # nightly build of main: does nothing until the repository variable NIGHTLY_ENABLED is "true", and only when main changed
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a manual build, e.g. 3.0.0-test"
        required: true
        default: "3.0.0-test"
      publish:
        description: "Also create the GitHub release (and tag) from this build"
        type: boolean
        default: false
      nightly:
        description: "Build and publish the rolling 'nightly' pre-release instead (production repo only; ignores the version above). Its tag is not a version, so only do this once the v2 Launcher is retired"
        type: boolean
        default: false
      legacy_tag:
        description: "Tag for the v2 Launcher, which only reads bare numeric tags: 'auto' = the next free 2.99.99.N (1 to 999), or an exact tag such as 3.0.0.0. Empty = the normal v<version> tag. Also attaches the flat <tag>.zip it needs."
        type: string
        default: ""

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  prepare:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      nightly: ${{ steps.v.outputs.nightly }}
      skip: ${{ steps.v.outputs.skip }}
      legacy_tag: ${{ steps.v.outputs.legacy_tag }}
    steps:
      - uses: actions/checkout@v6
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_NIGHTLY: ${{ inputs.nightly }}
          INPUT_LEGACY_TAG: ${{ inputs.legacy_tag }}
          NIGHTLY_ENABLED: ${{ vars.NIGHTLY_ENABLED }}
        run: |
          nightly=false; skip=false; legacy=""
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$INPUT_NIGHTLY" == "true" ]]; then
            nightly=true; publish=true
            # Nightlies are published only from the production repo (forks skip). The rolling release is tagged "nightly", which is not a version: the v2 Launcher
            # takes the newest release as its Beta update and crashes on that, so scheduled runs stay off until the repository variable NIGHTLY_ENABLED is "true"
            # (set it once the v2 Launcher is retired; the 2.14.2.1+ Launcher ignores tags that are not versions). A manual run with "nightly" ticked always goes ahead.
            if [[ "${GITHUB_REPOSITORY,,}" != "cyanlabs/syn3updater" ]]; then
              echo "::notice::Nightly builds are only published from CyanLabs/Syn3Updater"; skip=true
            fi
            if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$NIGHTLY_ENABLED" != "true" ]]; then
              echo "::notice::Scheduled nightlies are off (set the repository variable NIGHTLY_ENABLED to true to turn them on)"; skip=true
            fi
            # a scheduled run does nothing when main has not changed since the last nightly
            last="$(gh release view nightly --repo "$GITHUB_REPOSITORY" --json targetCommitish -q .targetCommitish 2>/dev/null || true)"
            if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$last" == "$GITHUB_SHA" ]]; then
              echo "::notice::main has not changed since the last nightly"; skip=true
            fi
            base="$(sed -n 's:.*<Version>\([0-9][0-9.]*\)</Version>.*:\1:p' Directory.Build.props | head -n1)"
            version="$base-nightly.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"; publish=true
          else
            version="$INPUT_VERSION"; publish="$INPUT_PUBLISH"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$version' is not a version like 3.0.0 or 3.0.0-beta.1"; exit 1
          fi
          # The v2 Launcher runs Version.Parse(tag) with no error handling, so a tag like v3.0.0-test9 crashes it. A release for it needs a bare numeric
          # tag (and a flat zip, see the release job); the real version stays in the release title.
          if [[ -n "$INPUT_LEGACY_TAG" && "$nightly" != "true" && "$GITHUB_REF_TYPE" != "tag" ]]; then
            if [[ "$INPUT_LEGACY_TAG" == "auto" ]]; then
              # numbers already taken by a release OR by a tag: deleting a release leaves its tag behind, and the check below refuses a tag that exists
              used="$({ gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName -q '.[].tagName'
                        git ls-remote --tags origin 'refs/tags/2.99.99.*' | sed 's:.*refs/tags/::' || true; } \
                      | sed -n 's/^2\.99\.99\.\([0-9][0-9]*\)$/\1/p' | sort -n | tail -n1)"
              next=$(( ${used:-0} + 1 ))
              if (( next > 999 )); then echo "::error::2.99.99.1 to 2.99.99.999 are all used; pass an explicit legacy_tag"; exit 1; fi
              legacy="2.99.99.$next"
            else
              legacy="$INPUT_LEGACY_TAG"
            fi
            if [[ ! "$legacy" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
              echo "::error::legacy_tag '$legacy' must be 'auto' or 1 to 4 dot-separated numbers like 2.99.99.5 or 3.0.0.0"; exit 1
            fi
            # fail now, not after twenty minutes of building
            if [[ "$publish" == "true" ]] && { gh release view "$legacy" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$legacy" >/dev/null 2>&1; }; then
              echo "::error::the tag/release '$legacy' already exists"; exit 1
            fi
          fi
          { echo "version=$version"; echo "publish=$publish"; echo "nightly=$nightly"; echo "skip=$skip"; echo "legacy_tag=$legacy"; } >> "$GITHUB_OUTPUT"
          echo "Building $version (publish=$publish, nightly=$nightly, skip=$skip)"

  test:
    name: Tests gate the release
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'          # every later job needs this one, so they are skipped with it
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/Syn3Updater.Tests -c Release
        env:
          SYN3_API_TOKEN: ${{ secrets.SYN3_API_TOKEN }}

  linux:
    name: Linux ${{ matrix.rid }}
    needs: [prepare, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Package
        run: scripts/package-linux.sh "${{ matrix.rid }}" "${{ needs.prepare.outputs.version }}" artifacts
        env:
          SYN3_API_TOKEN: ${{ secrets.SYN3_API_TOKEN }}
          # not a secret (it only lets the app send crash reports, and only when the user agrees); empty = this build never offers to send one
          SYN3_SENTRY_DSN: ${{ vars.SYN3_SENTRY_DSN }}
      # a package that cannot install cleanly (wrong launcher entry, missing files) must not be published
      - name: Verify the package installs
        run: scripts/verify-linux-package.sh artifacts/*.tar.gz
      - name: Build the .deb, .rpm and Arch package
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rpm
          scripts/package-deb.sh "${{ matrix.rid }}" "${{ needs.prepare.outputs.version }}" artifacts
          scripts/package-rpm.sh "${{ matrix.rid }}" "${{ needs.prepare.outputs.version }}" artifacts
          scripts/package-arch.sh "${{ matrix.rid }}" "${{ needs.prepare.outputs.version }}" artifacts      # built in an Arch Linux container
      # apt, dnf and pacman install them in real Debian, Ubuntu, Fedora and Arch containers, so wrong dependency names or a broken launcher stop the release
      - name: Verify the .deb, .rpm and Arch package install
        if: matrix.rid == 'linux-x64'
        run: scripts/verify-linux-distro-packages.sh artifacts
      - uses: actions/upload-artifact@v6
        with:
          name: pkg-${{ matrix.rid }}
          path: artifacts/*

  windows:
    name: Windows ${{ matrix.rid }}
    needs: [prepare, test]
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Package
        run: scripts/package-windows.sh "${{ matrix.rid }}" "${{ needs.prepare.outputs.version }}" artifacts
        env:
          SYN3_API_TOKEN: ${{ secrets.SYN3_API_TOKEN }}
          # not a secret (it only lets the app send crash reports, and only when the user agrees); empty = this build never offers to send one
          SYN3_SENTRY_DSN: ${{ vars.SYN3_SENTRY_DSN }}
      - uses: actions/upload-artifact@v6
        with:
          name: pkg-${{ matrix.rid }}
          path: artifacts/*

  macos:
    name: macOS ${{ matrix.rid }}
    needs: [prepare, test]
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    env:
      # optional: with these repository secrets the app is signed with a Developer ID and notarized; without them it is ad-hoc signed
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Import the signing certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/build.keychain"; password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          existing=()
          while IFS= read -r line; do existing+=("$(echo "$line" | tr -d '"' | xargs)"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Package
        run: scripts/package-macos.sh "${{ matrix.rid }}" "${{ needs.prepare.outputs.version }}" artifacts
        env:
          SYN3_API_TOKEN: ${{ secrets.SYN3_API_TOKEN }}
          # not a secret (it only lets the app send crash reports, and only when the user agrees); empty = this build never offers to send one
          SYN3_SENTRY_DSN: ${{ vars.SYN3_SENTRY_DSN }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}

      - uses: actions/upload-artifact@v6
        with:
          name: pkg-${{ matrix.rid }}
          path: artifacts/*

  release:
    name: Publish the GitHub release
    needs: [prepare, linux, windows, macos]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          NIGHTLY: ${{ needs.prepare.outputs.nightly }}
          LEGACY_TAG: ${{ needs.prepare.outputs.legacy_tag }}
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS && rm ./*.sha256
          if [[ -n "$LEGACY_TAG" ]]; then
            # The v2 Launcher wants ONE flat zip named <tag>.zip (no folder) whose content type is application/x-zip-compressed; it renames its own Launcher.exe away and
            # copies the zip over its folder. It holds the same files as the Windows package: Syn3Updater.exe plus the hybrid Launcher.exe and its libraries.
            win="$(find . -maxdepth 1 -name 'Syn3Updater-*-win-x64.zip' | head -n1)"
            legacy_dir="$RUNNER_TEMP/legacy"; rm -rf "$legacy_dir"; mkdir -p "$legacy_dir"
            "$GITHUB_WORKSPACE/scripts/make-legacy-zip.sh" "$win" "$LEGACY_TAG" "$legacy_dir/$LEGACY_TAG.zip"
            ( cd "$legacy_dir" && sha256sum "$LEGACY_TAG.zip" ) >> SHA256SUMS
          fi
          ls -l
          if [[ -n "$LEGACY_TAG" ]]; then
            # a DRAFT first, so an old Launcher never sees a release without its zip; published only once the content type is confirmed
            flags=(--draft --title "Syn3 Updater $VERSION" --generate-notes)
            [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
            gh release create "$LEGACY_TAG" ./* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" "${flags[@]}"
            id="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.draft and .tag_name == \"$LEGACY_TAG\") | .id" | head -n1)"
            [[ -n "$id" ]] || { echo "::error::could not find the draft release"; exit 1; }
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/x-zip-compressed" --data-binary "@$RUNNER_TEMP/legacy/$LEGACY_TAG.zip" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$LEGACY_TAG.zip" >/dev/null
            type="$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq ".assets[] | select(.name == \"$LEGACY_TAG.zip\") | .content_type")"
            if [[ "$type" != "application/x-zip-compressed" ]]; then echo "::error::$LEGACY_TAG.zip has content type '$type', the v2 Launcher needs application/x-zip-compressed; the release is left as a draft"; exit 1; fi
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false >/dev/null
            echo "published $LEGACY_TAG (Syn3 Updater $VERSION)"
          elif [[ "$NIGHTLY" == "true" ]]; then
            # one rolling pre-release: the tag stays "nightly" (it does not match v*, so it never starts this workflow); the app reads the version from the title
            gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
            gh release create nightly ./* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Syn3 Updater $VERSION" \
              --notes "Automatic build of the latest code (commit $GITHUB_SHA). Not tested: for people who want the newest changes and can cope with bugs."
          else
            flags=(--generate-notes --title "Syn3 Updater $VERSION")
            [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
            gh release create "v$VERSION" ./* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" "${flags[@]}"
          fi
